<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5" />

  <!-- Coordinate Grid / Axes (subtle) -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.6" />
  <line x1="32" y1="6" x2="32" y2="58" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Asymptotes (dashed amber diagonals) -->
  <line x1="10" y1="10" x2="54" y2="54" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2.5,2.5" opacity="0.85" />
  <line x1="10" y1="54" x2="54" y2="10" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2.5,2.5" opacity="0.85" />

  <!-- Left Hyperbola Branch (smooth bezier curve) -->
  <path d="M 12 12 Q 24 32 12 52" fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Right Hyperbola Branch (smooth bezier curve) -->
  <path d="M 52 12 Q 40 32 52 52" fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center point C(0,0) -->
  <circle cx="32" cy="32" r="2" fill="#f8fafc" />

  <!-- Focus dots F1 and F2 -->
  <circle cx="16" cy="32" r="1.5" fill="#f59e0b" />
  <circle cx="48" cy="32" r="1.5" fill="#f59e0b" />
</svg>
